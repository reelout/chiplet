name: Release
on:
  workflow_dispatch:
    inputs:
      allow-empty:
        description: 'Run the release even when no releasable changes are detected'
        required: false
        default: false
        type: boolean
      dry-run:
        description: 'Preview the release without publishing'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15'
          cache: 'pnpm'
      - run: pnpm install
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.GITHUB_TOKEN }}
      - run: pnpm validate
      - run: |
          ARGS=()
          [ '${{ inputs.allow-empty }}' = 'true' ] && ARGS+=(--allow-empty)
          [ '${{ inputs.dry-run }}' = 'true' ] && ARGS+=(--dry-run)
          pnpm reelout "${ARGS[@]}"
